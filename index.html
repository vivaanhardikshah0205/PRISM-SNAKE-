<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism Snake</title>
<style>
:root {
  /* Prism Snake: a jewel-bodied snake gliding over a dark neon garden; board centred, score floating above */
  --ink: #07051a; --paper: #fff6ea; --muted: #b9b0e0; --gold: #ffd166; --rose: #ff4ecd; --mint: #34f5a4;
  --display: "Arial Black", "Segoe UI Black", system-ui, sans-serif; --body: "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--paper); font-family: var(--body); user-select: none; -webkit-user-select: none; touch-action: none; }
canvas#bg { position: fixed; inset: 0; width: 100%; height: 100%; }
.wrap { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; padding: 2vh 3vw; gap: 1.5vh; }
.hud { width: min(100%, 860px); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
h1 { margin: 0; font: 900 clamp(22px, 5vh, 40px) var(--display); letter-spacing: .05em;
  background: linear-gradient(90deg,#ff4ecd,#a855f7,#4f8cff,#22d3ee,#34f5a4,#ffe45c,#ff9a3c,#ff4ecd); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: flow 8s linear infinite; }
@keyframes flow { to { background-position: 200% 0; } }
.stats { display: flex; gap: 10px; }
.pill { padding: 8px 14px; border-radius: 999px; background: rgba(20,12,48,.6); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(10px); font-weight: 800; font-size: 14px; }
.pill span { color: var(--muted); font-weight: 700; font-size: 11px; letter-spacing: .14em; margin-right: 6px; }
.board { position: relative; align-self: center; }
canvas#game { display: block; border-radius: 22px; box-shadow: 0 0 0 2px rgba(255,255,255,.08), 0 0 0 6px rgba(168,85,247,.25), 0 0 40px rgba(34,211,238,.35), 0 30px 80px rgba(0,0,0,.6), 0 0 80px rgba(168,85,247,.25); }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; border-radius: 22px; background: rgba(7,5,26,.55); backdrop-filter: blur(6px); }
.overlay.hide { display: none; }
.overlay h2 { margin: 0 0 8px; font: 900 clamp(28px, 6vh, 56px) var(--display); background: linear-gradient(90deg,#ffe45c,#ff4ecd,#22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
.overlay p { margin: 6px 0; color: var(--muted); font-weight: 600; }
.btn { margin-top: 14px; border: 0; border-radius: 16px; padding: 14px 30px; font: 900 18px var(--display); letter-spacing: .05em; color: #1a0f30; cursor: pointer;
  background: linear-gradient(135deg,#ffe45c,#ff9a3c 45%,#ff4ecd); box-shadow: 0 10px 30px rgba(255,78,205,.4); }
.btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.foot { color: var(--muted); font-size: 12px; text-align: center; }
kbd { border: 1px solid rgba(255,255,255,.3); border-radius: 6px; padding: 1px 6px; font-size: 11px; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
  <div class="hud">
    <h1>PRISM SNAKE</h1>
    <div class="stats">
      <div class="pill"><span>SCORE</span><b id="score">0</b></div>
      <div class="pill"><span>BEST</span><b id="best">0</b></div>
      <div class="pill"><span>COMBO</span><b id="combo">×1</b></div>
    </div>
  </div>
  <div class="board">
    <canvas id="game"></canvas>
    <div class="overlay" id="ov">
      <div>
        <h2 id="ovT">PRISM SNAKE</h2>
        <p id="ovP">Eat the glowing fruit. Golden stars are worth 5. Eat fast to build a combo.</p>
        <p>Arrows / WASD or swipe · <kbd>Space</kbd> pause</p>
        <button class="btn" id="go" type="button">PLAY</button>
      </div>
    </div>
  </div>
  <div class="foot">Walls wrap around. Don't bite your own tail.</div>
</div>
<script>
(() => {
  const N = 16;
  const cv = document.getElementById('game'), c = cv.getContext('2d');
  const bg = document.getElementById('bg'), b = bg.getContext('2d');
  const $ = id => document.getElementById(id);
  let size = 0, cell = 0, dpr = 1;
  const r = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
  let best = 0; try { best = +localStorage.getItem('prism-snake-best') || 0; } catch (e) {}
  $('best').textContent = best;

  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1);
    size = Math.floor(Math.min(innerWidth * 0.94, innerHeight * 0.74, 760));
    cell = size / N;
    cv.width = size * dpr; cv.height = size * dpr; cv.style.width = cv.style.height = size + 'px';
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    bg.width = innerWidth * dpr; bg.height = innerHeight * dpr; b.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  let snake, dir, queue, food, star, score, combo, lastEat, alive, paused, stepT, acc, parts, shake, tick;
  function reset() {
    snake = [{x:6,y:8},{x:5,y:8},{x:4,y:8},{x:3,y:8}];
    dir = {x:1,y:0}; queue = []; score = 0; combo = 1; lastEat = 0; alive = true; paused = false;
    stepT = 0.13; acc = 0; parts = []; shake = 0; tick = 0; star = null; place(); hud();
  }
  function free() { let p; do { p = {x:r(N), y:r(N)}; } while (snake.some(s => s.x===p.x && s.y===p.y) || (food && food.x===p.x && food.y===p.y)); return p; }
  function place() { food = free(); food.h = r(360); }
  function hud() { $('score').textContent = score; $('combo').textContent = '×' + combo; $('best').textContent = best; }

  function burst(x, y, hue, n) {
    for (let i = 0; i < n; i++) { const a = Math.random()*6.283, s = 40 + Math.random()*220;
      parts.push({x:(x+.5)*cell, y:(y+.5)*cell, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:.5+Math.random()*.6, age:0, h:hue+Math.random()*60-30, r:2+Math.random()*3}); }
  }
  let ac = null;
  function beep(f, d, g = .05, type = 'sine') { try { ac = ac || new AudioContext(); const o = ac.createOscillator(), v = ac.createGain();
    o.type = type; o.frequency.value = f; v.gain.setValueAtTime(g, ac.currentTime); v.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
    o.connect(v).connect(ac.destination); o.start(); o.stop(ac.currentTime + d); } catch (e) {} }

  function step(now) {
    if (queue.length) { const d = queue.shift(); if (d.x !== -dir.x || d.y !== -dir.y) dir = d; }
    const h = snake[0], n = {x:(h.x+dir.x+N)%N, y:(h.y+dir.y+N)%N};
    if (snake.slice(0,-1).some(s => s.x===n.x && s.y===n.y)) return die();
    snake.unshift(n);
    let grew = false;
    if (n.x===food.x && n.y===food.y) {
      combo = now - lastEat < 3000 ? Math.min(combo + 1, 9) : 1; lastEat = now;
      score += combo; burst(n.x, n.y, food.h, 26); beep(520 + combo*70, .15, .06, 'triangle');
      grew = true; place(); stepT = Math.max(.06, stepT * .975);
      if (!star && r(4) === 0) { star = free(); star.t = 7; }
    }
    if (star && n.x===star.x && n.y===star.y) { score += 5*combo; burst(n.x,n.y,48,50); shake = 8; beep(880,.3,.07,'square'); beep(1320,.35,.05); star = null; grew = true; }
    if (!grew) snake.pop();
    hud();
  }
  function die() {
    alive = false; shake = 14; beep(160, .5, .08, 'sawtooth');
    snake.forEach((s,i) => burst(s.x, s.y, (tick*40 + i*14) % 360, 4));
    if (score > best) { best = score; try { localStorage.setItem('prism-snake-best', best); } catch (e) {} }
    hud();
    setTimeout(() => { $('ovT').textContent = 'GAME OVER'; $('ovP').textContent = `Score ${score} · Best ${best}`; $('go').textContent = 'PLAY AGAIN'; $('ov').classList.remove('hide'); $('go').focus(); }, 700);
  }

  const FRUITS = ['apple','cherry','berry','orange','grape'];
  const stars = Array.from({length: 140}, () => ({x: Math.random(), y: Math.random(), z: .3 + Math.random()*.7, p: Math.random()*6.28}));
  function fruit(kind, x, y, R, t) {
    c.save(); c.translate(x, y + Math.sin(t*3)*R*.08);
    // soft glow pool underneath
    const glowCol = {apple:'255,60,90', cherry:'255,40,80', berry:'90,120,255', orange:'255,160,40', grape:'170,80,255'}[kind];
    const gp = c.createRadialGradient(0, R*.9, 0, 0, R*.9, R*1.6); gp.addColorStop(0, `rgba(${glowCol},.45)`); gp.addColorStop(1, `rgba(${glowCol},0)`);
    c.fillStyle = gp; c.fillRect(-R*2, -R, R*4, R*4);
    const ball = (bx, by, br, c1, c2, c3) => {
      const g = c.createRadialGradient(bx - br*.35, by - br*.4, br*.08, bx, by, br);
      g.addColorStop(0, c1); g.addColorStop(.5, c2); g.addColorStop(1, c3);
      c.fillStyle = g; c.beginPath(); c.arc(bx, by, br, 0, 6.283); c.fill();
      c.fillStyle = 'rgba(255,255,255,.75)'; c.beginPath(); c.ellipse(bx - br*.38, by - br*.42, br*.22, br*.13, -.6, 0, 6.283); c.fill();
    };
    const leaf = (lx, ly, ang, L) => { c.save(); c.translate(lx, ly); c.rotate(ang);
      const g = c.createLinearGradient(0, 0, L, 0); g.addColorStop(0, '#1fae5b'); g.addColorStop(1, '#8dff9a');
      c.fillStyle = g; c.beginPath(); c.moveTo(0,0); c.quadraticCurveTo(L*.5, -L*.45, L, 0); c.quadraticCurveTo(L*.5, L*.45, 0, 0); c.fill();
      c.strokeStyle = 'rgba(0,80,30,.5)'; c.lineWidth = 1; c.beginPath(); c.moveTo(0,0); c.lineTo(L*.9,0); c.stroke(); c.restore(); };
    c.shadowColor = `rgba(${glowCol},.9)`; c.shadowBlur = R*.9;
    if (kind === 'apple') { ball(0, R*.1, R*.82, '#ffd0d6', '#ff2d55', '#8a0022'); c.shadowBlur = 0;
      c.strokeStyle = '#6b3a12'; c.lineWidth = R*.12; c.beginPath(); c.moveTo(0,-R*.6); c.quadraticCurveTo(R*.05,-R*.9,R*.15,-R*1.0); c.stroke(); leaf(R*.1,-R*.85,-.5,R*.6); }
    else if (kind === 'cherry') { c.shadowBlur = 0; c.strokeStyle = '#3f8f2a'; c.lineWidth = R*.08;
      c.beginPath(); c.moveTo(-R*.4,R*.2); c.quadraticCurveTo(-R*.1,-R*.6,R*.15,-R*.9); c.moveTo(R*.45,R*.25); c.quadraticCurveTo(R*.3,-R*.4,R*.15,-R*.9); c.stroke();
      c.shadowBlur = R*.7; ball(-R*.42, R*.35, R*.45, '#ffc2cf', '#ff1f4b', '#6e0018'); ball(R*.45, R*.4, R*.45, '#ffc2cf', '#ff1f4b', '#6e0018'); c.shadowBlur = 0; leaf(R*.15,-R*.9,-.2,R*.5); }
    else if (kind === 'berry') { ball(0, R*.05, R*.78, '#cfe0ff', '#4f6dff', '#1a1f7a'); c.shadowBlur = 0;
      c.fillStyle = '#16195a'; for (let i = 0; i < 5; i++) { const a = i*1.2566 - 1.57; c.beginPath(); c.moveTo(0,-R*.62); c.lineTo(Math.cos(a)*R*.22, -R*.62 + Math.sin(a)*R*.22); c.lineTo(Math.cos(a+.6)*R*.08, -R*.62 + Math.sin(a+.6)*R*.08); c.fill(); }
      c.fillStyle = 'rgba(255,255,255,.12)'; for (let i = 0; i < 6; i++) { c.beginPath(); c.arc(Math.cos(i)*R*.4, R*.1+Math.sin(i*2)*R*.35, R*.07, 0, 6.283); c.fill(); } }
    else if (kind === 'orange') { ball(0, R*.08, R*.8, '#fff1c9', '#ff9f1c', '#b04a00'); c.shadowBlur = 0;
      c.fillStyle = 'rgba(120,50,0,.25)'; for (let i = 0; i < 14; i++) { c.beginPath(); c.arc(Math.cos(i*2.4)*R*.5, R*.08+Math.sin(i*1.7)*R*.5, R*.035, 0, 6.283); c.fill(); }
      leaf(0,-R*.68,-.9,R*.55); }
    else { c.shadowBlur = 0; c.strokeStyle = '#3f8f2a'; c.lineWidth = R*.08; c.beginPath(); c.moveTo(0,-R*.5); c.lineTo(R*.05,-R*.95); c.stroke();
      c.shadowBlur = R*.5; const pos = [[0,-R*.25],[-R*.32,-R*.12],[R*.32,-R*.12],[-R*.18,R*.2],[R*.18,R*.2],[0,R*.55],[-R*.42,R*.25],[R*.42,R*.25]];
      pos.forEach(([gx,gy]) => ball(gx, gy+R*.1, R*.27, '#f0d4ff', '#a855f7', '#4a0f8a')); c.shadowBlur = 0; leaf(R*.05,-R*.9,-.4,R*.45); }
    c.restore();
  }
  function drawBoard(t) {
    c.clearRect(0,0,size,size);
    // deep garden board with soft light pools
    const g = c.createRadialGradient(size*.5,size*.45,size*.1,size*.5,size*.5,size*.75);
    g.addColorStop(0,'#1c1250'); g.addColorStop(.6,'#110a36'); g.addColorStop(1,'#07051a');
    c.fillStyle = g; c.fillRect(0,0,size,size);
    // glowing dot grid that brightens near the snake head
    const hx = (snake[0].x+.5)*cell, hy = (snake[0].y+.5)*cell;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const px = (x+.5)*cell, py = (y+.5)*cell, d = Math.hypot(px-hx, py-hy) / size;
      const a = .06 + Math.max(0, .45 - d*1.4) + .03*Math.sin(t*2 + x*.6 + y*.4);
      c.fillStyle = `rgba(190,170,255,${a.toFixed(3)})`; c.beginPath(); c.arc(px, py, cell*.06, 0, 6.283); c.fill();
    }
    // food
    fruit(FRUITS[food.h % FRUITS.length], (food.x+.5)*cell, (food.y+.5)*cell, cell*.48 * (1 + .06*Math.sin(t*5)), t);
    // golden star with rays
    if (star) {
      const sx = (star.x+.5)*cell, sy = (star.y+.5)*cell; c.save(); c.translate(sx,sy);
      c.globalAlpha = star.t < 2 ? .5 + .5*Math.sin(t*20) : 1;
      c.rotate(t*.8); c.fillStyle = 'rgba(255,215,90,.18)';
      for (let i = 0; i < 8; i++) { c.rotate(Math.PI/4); c.beginPath(); c.moveTo(0,0); c.lineTo(cell*1.3,-cell*.12); c.lineTo(cell*1.3,cell*.12); c.fill(); }
      c.rotate(-t*2.8); c.shadowColor = '#ffd166'; c.shadowBlur = 30;
      const sg = c.createRadialGradient(-cell*.1,-cell*.1,1,0,0,cell*.5); sg.addColorStop(0,'#fffbe0'); sg.addColorStop(.5,'#ffd34d'); sg.addColorStop(1,'#d18a00');
      c.fillStyle = sg; c.beginPath(); for (let i = 0; i < 10; i++) { const a = i*Math.PI/5 - Math.PI/2, q = i%2 ? cell*.22 : cell*.5; c.lineTo(Math.cos(a)*q, Math.sin(a)*q); }
      c.closePath(); c.fill(); c.restore();
    }
    // snake: smooth tapered tube with scales
    const L = snake.length, pts = snake.map(s => ({x:(s.x+.5)*cell, y:(s.y+.5)*cell}));
    for (let i = L-1; i > 0; i--) {
      const a = pts[i], bpt = pts[i-1]; if (Math.abs(a.x-bpt.x) > cell*1.5 || Math.abs(a.y-bpt.y) > cell*1.5) continue;
      const hue = (t*50 + i*28) % 360, w = cell*(.78 - .38*i/L);
      c.strokeStyle = `hsl(${hue},95%,55%)`; c.lineWidth = w; c.lineCap = 'round';
      c.shadowColor = `hsl(${hue},100%,60%)`; c.shadowBlur = 16;
      c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(bpt.x,bpt.y); c.stroke();
    }
    c.shadowBlur = 0;
    for (let i = L-1; i >= 0; i--) {
      const hue = (t*50 + i*28) % 360, rad = cell*(.39 - .19*i/L) * (i === 0 ? 1.18 : 1), p = pts[i];
      const sg = c.createRadialGradient(p.x-rad*.35,p.y-rad*.45,rad*.05,p.x,p.y,rad);
      sg.addColorStop(0,`hsl(${hue},100%,92%)`); sg.addColorStop(.45,`hsl(${hue},95%,62%)`); sg.addColorStop(1,`hsl(${(hue+40)%360},90%,32%)`);
      c.fillStyle = sg; c.beginPath(); c.arc(p.x,p.y,rad,0,6.283); c.fill();
      if (i > 0) { c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 1; c.beginPath(); c.arc(p.x,p.y,rad*.6,3.6,5.8); c.stroke(); }
    }
    // head: eyes, tongue, crown
    { const h = pts[0], x = h.x, y = h.y, px = -dir.y, py = dir.x;
      if (Math.sin(t*4) > .6 && alive) { c.strokeStyle = '#ff3b6b'; c.lineWidth = cell*.07; c.beginPath();
        const tx = x + dir.x*cell*.75, ty = y + dir.y*cell*.75; c.moveTo(x + dir.x*cell*.4, y + dir.y*cell*.4); c.lineTo(tx, ty);
        c.lineTo(tx + (dir.x + px)*cell*.13, ty + (dir.y + py)*cell*.13); c.moveTo(tx, ty); c.lineTo(tx + (dir.x - px)*cell*.13, ty + (dir.y - py)*cell*.13); c.stroke(); }
      for (const sgn of [-1,1]) { const ex = x + dir.x*cell*.14 + px*cell*.2*sgn, ey = y + dir.y*cell*.14 + py*cell*.2*sgn;
        c.fillStyle = '#fff'; c.beginPath(); c.arc(ex,ey,cell*.13,0,6.283); c.fill();
        c.fillStyle = '#120830'; c.beginPath(); c.arc(ex+dir.x*cell*.05,ey+dir.y*cell*.05,cell*.07,0,6.283); c.fill();
        c.fillStyle = '#fff'; c.beginPath(); c.arc(ex+dir.x*cell*.05-cell*.025,ey+dir.y*cell*.05-cell*.03,cell*.025,0,6.283); c.fill(); }
      if (combo >= 3) { c.save(); c.translate(x, y - cell*.5); c.fillStyle = '#ffd166'; c.shadowColor = '#ffd166'; c.shadowBlur = 16;
        c.beginPath(); c.moveTo(-cell*.24,0); c.lineTo(-cell*.24,-cell*.2); c.lineTo(-cell*.11,-cell*.09); c.lineTo(0,-cell*.27); c.lineTo(cell*.11,-cell*.09); c.lineTo(cell*.24,-cell*.2); c.lineTo(cell*.24,0); c.closePath(); c.fill();
        c.fillStyle = '#ff4ecd'; c.beginPath(); c.arc(0,-cell*.08,cell*.045,0,6.283); c.fill(); c.restore(); }
    }
    // particles
    c.globalCompositeOperation = 'lighter';
    parts.forEach(p => { c.fillStyle = `hsla(${p.h},100%,65%,${1-p.age/p.life})`; c.beginPath(); c.arc(p.x,p.y,p.r*(1-p.age/p.life*.5),0,6.283); c.fill(); });
    c.globalCompositeOperation = 'source-over';
    // vignette + glass sheen
    const v = c.createRadialGradient(size/2,size/2,size*.35,size/2,size/2,size*.75); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.45)');
    c.fillStyle = v; c.fillRect(0,0,size,size);
    const sh = c.createLinearGradient(0,0,size,size*.6); sh.addColorStop(0,'rgba(255,255,255,.07)'); sh.addColorStop(.35,'rgba(255,255,255,0)');
    c.fillStyle = sh; c.fillRect(0,0,size,size);
  }
  function drawBg(t) {
    const W = innerWidth, H = innerHeight; b.fillStyle = '#05031a'; b.fillRect(0,0,W,H);
    b.globalCompositeOperation = 'lighter';
    ['#ff4ecd','#a855f7','#4f8cff','#22d3ee','#34f5a4','#ffe45c','#ff9a3c'].forEach((col,i) => {
      const x = W*(.5+.42*Math.sin(t*.06+i*1.7)), y = H*(.5+.42*Math.cos(t*.05+i*2.3)), R = Math.max(W,H)*.5;
      const g = b.createRadialGradient(x,y,0,x,y,R); g.addColorStop(0,col+'38'); g.addColorStop(1,col+'00'); b.fillStyle = g; b.fillRect(0,0,W,H); });
    // aurora ribbons
    for (let k = 0; k < 3; k++) {
      b.beginPath(); for (let x = 0; x <= W; x += 20) { const y = H*(.25 + k*.25) + Math.sin(x*.004 + t*.4 + k*2)*H*.06 + Math.sin(x*.011 - t*.3)*H*.02; x ? b.lineTo(x,y) : b.moveTo(x,y); }
      b.strokeStyle = ['rgba(52,245,164,.07)','rgba(168,85,247,.07)','rgba(34,211,238,.07)'][k]; b.lineWidth = H*.05; b.filter = 'blur(18px)'; b.stroke(); b.filter = 'none';
    }
    b.globalCompositeOperation = 'source-over';
    stars.forEach(st => { const a = .25 + .6*(.5+.5*Math.sin(t*2*st.z + st.p));
      const x = ((st.x + t*.004*st.z) % 1) * W, y = st.y * H;
      b.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`; b.beginPath(); b.arc(x, y, st.z*1.6, 0, 6.283); b.fill(); });
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now-last)/1000); last = now; const t = now/1000; tick = t;
    if (alive && !paused && started) { acc += dt; while (acc >= stepT && alive) { acc -= stepT; step(now); } if (star && (star.t -= dt) <= 0) star = null; if (now - lastEat > 3000 && combo > 1) { combo = 1; hud(); } }
    parts = parts.filter(p => (p.age += dt) < p.life); parts.forEach(p => { p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= .95; p.vy *= .95; });
    shake *= .88; cv.style.transform = shake > .3 ? `translate(${(Math.random()-.5)*shake}px,${(Math.random()-.5)*shake}px)` : '';
    drawBg(t); drawBoard(t); requestAnimationFrame(frame);
  }
  let started = false;
  function start() { reset(); started = true; $('ov').classList.add('hide'); beep(660,.12); }
  $('go').addEventListener('click', start);
  const keys = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
  addEventListener('keydown', e => {
    const k = keys[e.key] || keys[e.key.toLowerCase()];
    if (k) { e.preventDefault(); if (!started || !alive) return; if (queue.length < 3) queue.push({x:k[0],y:k[1]}); }
    if (e.key === ' ') { e.preventDefault(); if (started && alive) paused = !paused; else if (!$('ov').classList.contains('hide')) start(); }
  });
  let tx = 0, ty = 0;
  addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx),Math.abs(dy)) < 24 || !started || !alive) return;
    queue.push(Math.abs(dx) > Math.abs(dy) ? {x:Math.sign(dx),y:0} : {x:0,y:Math.sign(dy)}); });
  reset(); requestAnimationFrame(frame);
})();
</script>
</body>
